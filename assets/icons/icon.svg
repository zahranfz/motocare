<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C91823" />
      <stop offset="100%" stop-color="#80060E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FEF8F3" stroke-opacity="0.12" stroke-width="12" />
  
  <!-- Motorcycle Icon -->
  <g transform="translate(64, 96) scale(1.5)" filter="url(#shadow)">
    <!-- Wheels -->
    <circle cx="60" cy="160" r="34" fill="none" stroke="#FEF8F3" stroke-width="12" />
    <circle cx="60" cy="160" r="12" fill="#FEF8F3" />
    <circle cx="196" cy="160" r="34" fill="none" stroke="#FEF8F3" stroke-width="12" />
    <circle cx="196" cy="160" r="12" fill="#FEF8F3" />
    
    <!-- Bike Body Frame & Engine -->
    <path d="M 60 160 L 105 105 L 140 105 L 180 145 M 105 105 L 125 155 L 196 160 M 130 90 L 145 65 L 175 65 M 120 70 L 100 85 L 75 85" 
          fill="none" stroke="#FEF8F3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Fuel Tank / Body Cover Accent -->
    <path d="M 105 100 Q 130 85 155 105 Q 135 125 110 115 Z" fill="#FBDAD7" />
    
    <!-- Speedometer needle & Pulse Spark -->
    <circle cx="140" cy="65" r="7" fill="#FBDAD7" />
  </g>
  
  <!-- MotoCare Brand Text at bottom -->
  <text x="256" y="440" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FEF8F3" text-anchor="middle" letter-spacing="4">MOTOCARE</text>
</svg>
